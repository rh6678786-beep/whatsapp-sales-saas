name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main, master]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to production
        run: |
          echo "Deploy step — add your deployment target here"
          # Example: rsync, scp, docker push, or Vercel/Netlify CLI
